web-root: /var/vcap/packages/blacksmith/ui
env:      <%= properties.env %>
shareable: <%= properties.shareable %>

<% if p('services.skip_tls_verify', []).length > 0 -%>
services:
  skip_tls_verify: <%= p('services.skip_tls_verify', []).to_json %>
<% end -%>

<% if p('shield.enabled') -%>
shield:
  enabled: true
  address: <%= properties.shield.address.to_s.to_json %>
  skip_ssl_validation: <%= properties.shield.skip_ssl_validation %>

  agent: <%= properties.shield.agent.to_s.to_json %>

<% if p('shield.auth_method', '') == 'local' -%>
  auth_method: <%= properties.shield.auth_method.to_s.to_json %>
  username: <%= properties.shield.username.to_s.to_json %>
  password: <%= properties.shield.password.to_s.to_json %>
<% else -%>
  auth_method: <%= properties.shield.auth_method.to_s.to_json %>
  token: <%= properties.shield.token.to_s.to_json %>
<% end -%>

<% if p('shield.schedule', '') != '' -%>
  schedule: <%= properties.shield.schedule.to_s.to_json %>
<% end -%>
<% if p('shield.retain', '') != '' -%>
  retain: <%= properties.shield.retain.to_s.to_json %>
<% end -%>

  tenant: <%= properties.shield.tenant.to_s.to_json %>
  store: <%= properties.shield.store.to_s.to_json %>

  enabled_on_targets: <%= p('shield.enabled_on_targets', []).to_json %>
<% end -%>

broker:
  username: <%= properties.broker.username.to_s.to_json %>
  password: <%= properties.broker.password.to_s.to_json %>
  port: <%= p('broker.port') %>
  bind_ip: 0.0.0.0
<% if p('broker.tls.enabled') -%>
  
  tls:
    enabled: true
    port: <%= p('broker.tls.port') %>
    certificate: /var/vcap/jobs/blacksmith/config/tls/blacksmith.pub
    key: /var/vcap/jobs/blacksmith/config/tls/blacksmith.key
    protocols: <%= p('broker.tls.protocols') %>
    ciphers: <%= p('broker.tls.ciphers') %>
    reuse_after: <%= p('broker.tls.reuse-after') %>
<% end -%>
<% cf_apis = p('broker.cf.apis', {}) -%>
<% if cf_apis && !cf_apis.empty? -%>

  cf:
    apis:
<% cf_apis.each do |api_key, api_config| -%>
      <%= api_key.to_s.to_json %>:
        name: <%= api_config['name'].to_s.to_json %>
        endpoint: <%= api_config['endpoint'].to_s.to_json %>
        username: <%= api_config['username'].to_s.to_json %>
        password: <%= api_config['password'].to_s.to_json %>
        cacert: <%= (api_config['ca_cert'] || p('broker.cf.ca_cert')).to_json %>
        skip_ssl_validation: <%= (api_config.key?('skip_ssl_validation') ? api_config['skip_ssl_validation'] : p('broker.cf.skip_ssl_validation')) ? true : false %>
<% end -%>
<% end -%>

vault:
  address: http://127.0.0.1:8200
  credentials: /var/vcap/store/blacksmith/.vault/creds

<%
  bosh_request_timeout = p('bosh.request_timeout')
  unless bosh_request_timeout.to_s =~ /\A\d+\z/ && Integer(bosh_request_timeout.to_s, 10) > 0
    raise "bosh.request_timeout is #{bosh_request_timeout.inspect}, but it must be a positive whole number of seconds, such as 60. Set bosh.request_timeout to the seconds Blacksmith should wait for a single BOSH director request."
  end
-%>
bosh:
  address: <%= p('bosh.address').to_s.to_json %>
  username: <%= p('bosh.username').to_s.to_json %>
  password: <%= p('bosh.password').to_s.to_json %>
  cacert: <%= p('bosh.ca_cert', '').to_json %>
  request_timeout: <%= Integer(bosh_request_timeout.to_s, 10) %>
  <% if p('bosh.cloud-config', '') != '' %>
  network: <%= p('bosh.network').to_s.to_json %>
  cloud-config: /var/vcap/jobs/blacksmith/config/cloud-config.yml
  <% end %>
  stemcells: <%= p('bosh.stemcells', []).to_json %>
  releases: <%= p('bosh.releases', []).to_json %>

<% if p('credhub.cleanup.enabled') -%>
<%
  credhub_required = %w[credhub.url credhub.ca_cert credhub.client_secret credhub.director_name]
  credhub_missing = credhub_required.select { |k| p(k, '').to_s.strip.empty? }
  # With none of the four set, the broker logs a warning and deletes nothing. With only some set, the
  # connection is half configured, so fail the render and name what is missing.
  if !credhub_missing.empty? && credhub_missing.length < credhub_required.length
    raise "credhub.cleanup.enabled is true and some, but not all, of the credhub connection properties are set. These are not set: #{credhub_missing.join(', ')}. Set all four credhub connection properties together, or none of them."
  end
  # An unquoted "sweep: off" in a manifest is YAML false, so read it as "off".
  credhub_sweep = p('credhub.cleanup.sweep')
  credhub_sweep = 'off' if credhub_sweep == false
  credhub_protected = ([spec.deployment] + p('credhub.cleanup.protected_deployments')).uniq
-%>
credhub:
  url: <%= p('credhub.url').to_json %>
  ca_cert: <%= p('credhub.ca_cert').to_json %>
  client_id: <%= p('credhub.client_id').to_json %>
  client_secret: <%= p('credhub.client_secret').to_json %>
  director_name: <%= p('credhub.director_name').to_json %>
  uaa_url: <%= p('credhub.uaa_url').to_json %>
  cleanup:
    enabled: true
    sweep: <%= credhub_sweep.to_json %>
    protected_deployments: <%= credhub_protected.to_json %>
<% end -%>

forges:
  auto-scan: true
  scan-paths:
    - "/var/vcap/jobs"            # BOSH job templates location
    - "/var/vcap/data/blacksmith" # BOSH persistent data location
  scan-patterns:
    - "*-forge/templates"         # BOSH template forge pattern
    - "*-forge"                   # BOSH data forge pattern

